<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#EEF2F8"/>
<title>RECOMP</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#EEF2F8;--bg2:#F7FAFE;
  --ink:#15233B;--ink2:#566076;--dim:#97A1B4;
  --line:#E4EAF3;--line2:#D3DBE9;
  --surface:#FFFFFF;--surface2:#F1F5FB;--glassBorder:#E4EAF3;
  --sapphire:#1E4488;--sapphireD:#0F2C5C;--sapphireL:#3B6FD4;
  --teal:#0E9E8E;--tealL:#19C2A8;--gold:#C9A24A;--goldL:#E3C77E;
  --plum:#5A57B0;--rose:#C25563;
  --green:#0E9E8E;--lime:#0E9E8E;--emerald:#0E9E8E;
  --blue:#3B6FD4;--cyan:#0E9E8E;
  --purple:#5A57B0;--violet:#5A57B0;--red:#C25563;--pink:#C25563;
  --grad:linear-gradient(135deg,#3B6FD4,#1E4488);
  --hot:linear-gradient(135deg,#3B6FD4,#1E4488);
  --sapgrad:linear-gradient(135deg,#4A7FE0,#1E4488);
  --volt:linear-gradient(135deg,#19C2A8,#0E9E8E);
  --ice:linear-gradient(135deg,#5A57B0,#3B6FD4);
  --goldgrad:linear-gradient(135deg,#E3C77E,#C9A24A);
  --sh:0 6px 26px rgba(30,55,110,.08);--sh2:0 2px 10px rgba(30,55,110,.05);
  --shHover:0 10px 32px rgba(30,68,136,.26);
  --nav-h:80px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;overflow:hidden;}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.blob{position:absolute;border-radius:50%;filter:blur(85px);opacity:.5;}
.b1{width:380px;height:380px;background:#3B6FD4;top:-120px;left:-80px;}
.b2{width:340px;height:340px;background:#19C2A8;bottom:-100px;right:-60px;opacity:.4;}
.b3{width:300px;height:300px;background:#5A57B0;top:40%;left:50%;opacity:.25;}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;}

/* ============ LOGIN ============ */
#login-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
#login-overlay.hidden{display:none;}
.login-card{width:100%;max-width:420px;text-align:center;}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:54px;font-weight:700;letter-spacing:1px;}
.login-logo .a{color:var(--ink);}.login-logo .b{color:var(--sapphire);}
.login-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--ink2);margin-top:2px;}
.login-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--sapphire);text-transform:uppercase;margin:38px 0 12px;}
#code-input{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:22px;font-size:26px;font-weight:700;text-align:center;letter-spacing:6px;color:var(--ink);font-family:'Manrope',sans-serif;box-shadow:var(--sh);outline:none;transition:.2s;}
#code-input:focus{border-color:var(--sapphire);}
#login-err{color:var(--rose);font-size:13px;font-weight:600;margin-top:12px;min-height:18px;}
.btn-primary{width:100%;background:var(--sapgrad);color:#fff;border:none;border-radius:16px;padding:19px;font-size:15px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-top:14px;cursor:pointer;box-shadow:var(--shHover);transition:.2s;font-family:'Manrope',sans-serif;}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.6;}
.login-hint{font-size:12.5px;color:var(--dim);margin-top:22px;line-height:1.7;}

/* ============ ONBOARDING ============ */
#onb-overlay{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;padding:0;}
#onb-overlay.show{display:flex;}
.onb-top{padding:22px 22px 0;}
.onb-bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;}
.onb-fill{height:100%;background:var(--sapgrad);border-radius:99px;width:0%;transition:width .35s cubic-bezier(.4,0,.2,1);}
.onb-step{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin-top:12px;}
.onb-body{flex:1;overflow-y:auto;padding:14px 22px 22px;display:flex;flex-direction:column;}
.onb-q{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1.2;margin-bottom:6px;}
.onb-desc{font-size:14px;color:var(--ink2);margin-bottom:22px;line-height:1.5;}
.onb-opts{display:flex;flex-direction:column;gap:11px;}
.onb-opt{background:var(--surface);border:2px solid var(--line);border-radius:15px;padding:18px 20px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;transition:.18s;box-shadow:var(--sh2);font-family:'Manrope',sans-serif;display:flex;align-items:center;justify-content:space-between;}
.onb-opt:active{transform:scale(.99);}
.onb-opt.sel{border-color:var(--sapphire);background:linear-gradient(135deg,rgba(59,111,212,.07),rgba(30,68,136,.04));}
.onb-opt .tick{opacity:0;color:var(--sapphire);font-weight:800;}
.onb-opt.sel .tick{opacity:1;}
.onb-input{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:15px;padding:18px 20px;font-size:18px;font-weight:600;color:var(--ink);font-family:'Manrope',sans-serif;outline:none;box-shadow:var(--sh2);}
.onb-input:focus{border-color:var(--sapphire);}
.onb-row{display:flex;gap:10px;}
.onb-row .onb-input{flex:1;}
.onb-unit{font-size:12px;color:var(--dim);font-weight:700;margin:8px 0 0 4px;letter-spacing:.5px;text-transform:uppercase;}
.onb-foot{padding:16px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);}
.onb-next{width:100%;background:var(--sapgrad);color:#fff;border:none;border-radius:15px;padding:18px;font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:var(--shHover);font-family:'Manrope',sans-serif;transition:.2s;}
.onb-next:disabled{opacity:.45;box-shadow:none;}
.onb-next:active:not(:disabled){transform:scale(.98);}
.onb-back{background:none;border:none;color:var(--ink2);font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;padding:10px;margin-top:8px;width:100%;font-family:'Manrope',sans-serif;text-transform:uppercase;}

/* plan reveal */
.plan-reveal{text-align:center;padding:8px 0;}
.plan-reveal h2{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;margin-bottom:4px;}
.plan-reveal .pr-sub{font-size:14px;color:var(--ink2);margin-bottom:26px;}
.plan-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
.plan-stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh2);}
.plan-stat .v{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:var(--sapphire);}
.plan-stat.teal .v{color:var(--teal);}
.plan-stat .l{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin-top:2px;}

/* ============ APP SHELL ============ */
.header{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;}
.h-logo{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:700;letter-spacing:.5px;}
.h-logo .b{color:var(--sapphire);}
.h-sub{font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.5px;margin-top:1px;}
.h-btn{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;box-shadow:var(--sh2);color:var(--sapphire);}
.streak-badge{display:inline-flex;align-items:center;gap:5px;background:var(--goldgrad);color:#5c4410;font-size:12px;font-weight:800;padding:7px 12px;border-radius:99px;box-shadow:var(--sh2);}

.content{flex:1;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:6px 18px calc(var(--nav-h) + 50px);}
.content::-webkit-scrollbar{display:none;}

.nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--dim);position:relative;font-size:21px;transition:.2s;}
.nav-item.active{color:var(--sapphire);}
.nav-item .nl{font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
.nav-item.active::before{content:'';position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--sapgrad);}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh);margin-bottom:14px;}
.card-t{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-bottom:14px;}
.serif{font-family:'Cormorant Garamond',serif;}

.greeting{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1.15;margin:6px 0 2px;}
.greeting .nm{color:var(--sapphire);}
.gdate{font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:16px;}

/* rings */
.rings{display:flex;justify-content:center;gap:30px;padding:8px 0 4px;}
.ring-wrap{text-align:center;}
.ring-box{position:relative;width:124px;height:124px;}
.ring-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;line-height:1;}
.ring-unit{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.5px;margin-top:2px;}
.ring-lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink2);margin-top:8px;}

/* macro bars */
.macro-row{margin-bottom:14px;}
.macro-row:last-child{margin-bottom:0;}
.macro-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.macro-name{font-size:13px;font-weight:700;}
.macro-val{font-size:12px;font-weight:600;color:var(--ink2);}
.macro-track{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden;}
.macro-prog{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1);}

/* generic buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:13px;padding:13px 18px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif;letter-spacing:.3px;transition:.18s;}
.btn:active{transform:scale(.98);}
.btn-fill{background:var(--sapgrad);color:#fff;box-shadow:var(--sh2);}
.btn-soft{background:var(--surface2);color:var(--sapphire);border:1px solid var(--line);}
.btn-ghost{background:none;color:var(--ink2);}
.btn-full{width:100%;}
.btn-teal{background:var(--volt);color:#fff;}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px 10px;text-align:center;box-shadow:var(--sh2);}
.tile .tv{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--sapphire);}
.tile .tl{font-size:9.5px;font-weight:700;letter-spacing:.6px;color:var(--dim);text-transform:uppercase;margin-top:2px;}

/* training hero */
.train-hero{background:var(--sapgrad);border-radius:20px;padding:22px;color:#fff;box-shadow:var(--shHover);margin-bottom:14px;position:relative;overflow:hidden;}
.train-hero::after{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:rgba(255,255,255,.08);border-radius:50%;}
.th-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;}
.th-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;margin:6px 0 14px;position:relative;z-index:1;}
.th-stats{display:flex;gap:20px;position:relative;z-index:1;}
.th-stat .v{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;}
.th-stat .l{font-size:10px;font-weight:600;opacity:.8;letter-spacing:.5px;text-transform:uppercase;}
.th-btn{margin-top:16px;background:#fff;color:var(--sapphire);border:none;border-radius:12px;padding:13px;font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;width:100%;cursor:pointer;position:relative;z-index:1;font-family:'Manrope',sans-serif;}

/* muscle map */
.muscle-card svg{width:100%;height:auto;display:block;}
.mm-stats{display:flex;gap:10px;margin-bottom:14px;}
.mm-stat{flex:1;background:var(--surface2);border-radius:13px;padding:12px;text-align:center;}
.mm-stat .v{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--sapphire);}
.mm-stat .l{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--dim);text-transform:uppercase;margin-top:2px;}
.mm-legend{display:flex;justify-content:center;gap:18px;margin-top:12px;}
.mm-leg{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink2);}
.mm-dot{width:11px;height:11px;border-radius:50%;}
.mm-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;justify-content:center;}
.mm-chip{font-size:11px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--surface2);color:var(--sapphire);border:1px solid var(--line);}

/* exercise cards */
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px;box-shadow:var(--sh2);}
.ex-card.pr{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),var(--sh2);}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.ex-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;line-height:1.15;}
.ex-meta{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:4px;}
.ex-last{font-size:11.5px;color:var(--teal);font-weight:700;margin-bottom:10px;}
.ex-tools{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;}
.ex-tool{font-size:11px;font-weight:700;padding:6px 11px;border-radius:9px;background:var(--surface2);color:var(--sapphire);border:1px solid var(--line);cursor:pointer;}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.set-n{font-size:11px;font-weight:800;color:var(--dim);width:18px;}
.set-in{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center;font-size:15px;font-weight:700;color:var(--ink);font-family:'Manrope',sans-serif;outline:none;}
.set-in:focus{border-color:var(--sapphire);}
.set-x{font-size:12px;color:var(--dim);font-weight:700;}
.set-1rm{font-size:11px;color:var(--teal);font-weight:700;min-width:54px;text-align:right;}
.pr-badge{background:var(--goldgrad);color:#5c4410;font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;letter-spacing:.5px;}

/* chat */
.chat-wrap{display:flex;flex-direction:column;gap:12px;}
.msg{max-width:85%;padding:13px 16px;border-radius:16px;font-size:14px;line-height:1.5;}
.msg.user{align-self:flex-end;background:var(--sapgrad);color:#fff;border-bottom-right-radius:5px;}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--sh2);}
.chat-input-row{display:flex;gap:9px;margin-top:12px;}
.chat-input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;font-family:'Manrope',sans-serif;outline:none;resize:none;color:var(--ink);box-shadow:var(--sh2);}
.chat-input:focus{border-color:var(--sapphire);}
.chat-send{background:var(--sapgrad);color:#fff;border:none;border-radius:14px;padding:0 18px;font-size:18px;cursor:pointer;}
.quick-prompts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.qp{font-size:12px;font-weight:600;padding:9px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--sapphire);cursor:pointer;box-shadow:var(--sh2);}
.meal-result{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px;}
.meal-macros{display:flex;gap:14px;margin:10px 0;}
.meal-macro{text-align:center;}
.meal-macro .v{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--sapphire);}
.meal-macro .l{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}

/* journal */
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:4px;margin-bottom:16px;}
.seg-btn{flex:1;text-align:center;padding:10px;font-size:12.5px;font-weight:700;border-radius:10px;cursor:pointer;color:var(--ink2);transition:.18s;}
.seg-btn.active{background:var(--surface);color:var(--sapphire);box-shadow:var(--sh2);}
.jrn-item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px;box-shadow:var(--sh2);cursor:pointer;}
.jrn-date{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--dim);text-transform:uppercase;margin-bottom:6px;}
.jrn-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;}
.jrn-meta{font-size:12.5px;color:var(--ink2);font-weight:600;margin-top:3px;}
.jrn-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;line-height:1.8;color:var(--ink2);display:none;}
.jrn-item.open .jrn-detail{display:block;}
.jrn-tag{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:7px;letter-spacing:.5px;text-transform:uppercase;}
.jrn-tag.w{background:rgba(30,68,136,.1);color:var(--sapphire);}
.jrn-tag.m{background:rgba(14,158,142,.12);color:var(--teal);}
.jrn-tag.wt{background:rgba(90,87,176,.12);color:var(--plum);}

/* popups */
.pop-overlay{position:fixed;inset:0;z-index:80;background:rgba(15,30,60,.4);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;}
.pop-overlay.show{display:flex;}
.pop{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:24px 22px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15);animation:popUp .3s cubic-bezier(.2,.8,.2,1);}
@keyframes popUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.pop-handle{width:40px;height:5px;background:var(--line2);border-radius:99px;margin:0 auto 18px;}
.pop-t{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;margin-bottom:4px;}
.pop-close{position:absolute;}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;}
.step-lbl{font-size:14px;font-weight:700;}
.step-ctrl{display:flex;align-items:center;gap:14px;}
.step-btn{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:18px;font-weight:700;color:var(--sapphire);cursor:pointer;}
.step-v{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;min-width:54px;text-align:center;}

/* timer */
#rest-timer{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--volt);color:#fff;padding:14px;text-align:center;font-weight:800;font-size:15px;letter-spacing:.5px;transform:translateY(-100%);transition:transform .3s;display:flex;align-items:center;justify-content:center;gap:14px;}
#rest-timer.show{transform:translateY(0);}
.rt-time{font-family:'Cormorant Garamond',serif;font-size:24px;}
.rt-x{background:rgba(255,255,255,.25);border:none;color:#fff;width:28px;height:28px;border-radius:8px;font-size:14px;cursor:pointer;}

/* admin */
.admin-user{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:var(--sh2);display:flex;justify-content:space-between;align-items:center;}
.au-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;}
.au-meta{font-size:12px;color:var(--ink2);margin-top:2px;}

<script>

const SUPABASE_URL='https://pbdgqnbiormtkmrrcubt.supabase.co';

/* ============================================================
   SUPABASE
============================================================ */
let sb=null, SESSION=null;
function loadSupabase(){
  return new Promise((res)=>{
    if(window.supabase){res();return;}
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';

}
function codeToEmail(code){ return 'u_'+code.toLowerCase().replace(/[^a-z0-9]/g,'')+'@recomp.app'; }
function codeToPass(code){ return 'rc_'+code.toLowerCase()+'_v1_pw'; }

/* ============================================================

let USER={};          // profile + plan
let DATA={days:{},workouts:{},weights:[],meals:{}}; // logged data

/* ============================================================
   LOGIN
============================================================ */
function showErr(m){document.getElementById('login-err').textContent=m||'';}
function setLoginBusy(b){const btn=document.querySelector('#login-overlay .btn-primary');if(btn){btn.disabled=b;btn.textContent=b?'Connecting…':'Access My Data';}}

async function doLogin(){
  const code=document.getElementById('code-input').value.trim();
  if(code.length<3){showErr('Code must be at least 3 characters');return;}
  showErr(''); setLoginBusy(true);
  CURRENT_CODE=code;

  // ADMIN?
  if(code.toLowerCase()===ADMIN_CODE.toLowerCase()){
    await ensureSb();
    await adminLogin();
    return;
  }

  try{
    await ensureSb();
    const email=codeToEmail(code), pass=codeToPass(code);
    // try sign in
    let {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){
      // sign up (first time)
      const su=await sb.auth.signUp({email,password:pass});
      if(su.error){showErr(su.error.message);setLoginBusy(false);return;}
      data=su.data;
      // may need a fresh sign-in if session not returned
      if(!data.session){
        const si=await sb.auth.signInWithPassword({email,password:pass});
        if(si.error){showErr(si.error.message);setLoginBusy(false);return;}
        data=si.data;
      }
    }
    SESSION=data.session||data.user?{user:data.user}:null;
    if(!SESSION||!SESSION.user){const u=await sb.auth.getUser();SESSION={user:u.data.user};}
    await afterAuth();
  }catch(e){
    console.error(e); showErr('Connection problem — try again'); setLoginBusy(false);
  }
}

async function ensureSb(){
  if(sb)return;
  await loadSupabase();
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,storage:window.localStorage}});
}

async function afterAuth(){
  // pull profile + data
  await pullAll();
  setLoginBusy(false);
  document.getElementById('code-input').value='';
  document.getElementById('login-overlay').classList.add('hidden');

  if(!USER.onboarded){
    startOnboarding();
  }else{
    enterApp();
  }
}

/* ============================================================
   DATA SYNC (Supabase rc_store key/value per user)
============================================================ */
async function pullAll(){
  USER={}; DATA={days:{},workouts:{},weights:[],meals:{}};
  if(!sb||!SESSION)return;
  try{
    const {data}=await sb.from('rc_store').select('key,value');
    if(data){
      data.forEach(r=>{
        if(r.key==='profile')USER=r.value||{};
        else if(r.key==='data')DATA=Object.assign(DATA,r.value||{});
      });
    }
  }catch(e){console.warn('pull failed',e);}
}
let pushTimer=null;
function pushKey(key,val){
  if(!sb||!SESSION)return;
  sb.from('rc_store').upsert({user_id:SESSION.user.id,key,value:val,updated_at:new Date().toISOString()}).then(()=>{}).catch(e=>console.warn('push',e));
}
function saveProfile(){pushKey('profile',USER);}
function saveData(){
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>pushKey('data',DATA),400);
}

/* ============================================================
   ONBOARDING
============================================================ */
const ONB=[
  {key:'name',type:'text',q:"What's your name?",desc:"This is your space — we'll make it personal.",ph:'Full name'},
  {key:'sex',type:'choice',q:"Biological sex?",desc:"Used to calculate your calorie and protein needs accurately.",opts:[['male','Male'],['female','Female']]},
  {key:'age',type:'num',q:"How old are you?",desc:"Age affects your metabolism math.",ph:'Age',unit:'years',min:13,max:99},
  {key:'height',type:'height',q:"How tall are you?",desc:"We use this for your calorie baseline.",},
  {key:'weight',type:'num',q:"Current weight?",desc:"Your starting point — we'll track it from here.",ph:'Weight',unit:'lbs',min:60,max:500},
  {key:'goalWeight',type:'num',q:"Goal weight?",desc:"Where you want to be.",ph:'Goal weight',unit:'lbs',min:60,max:500},
  {key:'goal',type:'choice',q:"Primary goal?",desc:"This shapes everything — your calories, macros, and training.",opts:[['recomp','Lose fat, keep/build muscle'],['cut','Lose fat fast'],['bulk','Build muscle'],['maintain','Maintain & get stronger']]},
  {key:'days',type:'choice',q:"Training days per week?",desc:"Be realistic — consistency beats ambition.",opts:[['3','3 days'],['4','4 days'],['5','5 days'],['6','6 days']]},
  {key:'place',type:'choice',q:"Where do you train?",desc:"So your AI coach builds workouts from what you actually have.",opts:[['fullgym','Full gym (machines, barbells, everything)'],['homegym','Home gym (dumbbells, kettlebells)'],['minimal','Minimal / bodyweight']]},
  {key:'diet',type:'choice',q:"Any dietary style?",desc:"Helps the food coach suggest the right things.",opts:[['none','No restrictions'],['vegetarian','Vegetarian'],['vegan','Vegan'],['pescatarian','Pescatarian'],['halal','Halal'],['kosher','Kosher']]},
];
let onbIdx=0, onbData={};

function startOnboarding(){
  onbIdx=0; onbData={};
  document.getElementById('onb-overlay').classList.add('show');
  renderOnb();
}
function renderOnb(){
  const step=ONB[onbIdx];
  const total=ONB.length;
  document.getElementById('onb-fill').style.width=((onbIdx)/total*100)+'%';
  document.getElementById('onb-step').textContent='Step '+(onbIdx+1)+' of '+total;
  document.getElementById('onb-back').style.display=onbIdx>0?'block':'none';
  const body=document.getElementById('onb-body');
  let html='<div class="fadein"><div class="onb-q">'+step.q+'</div><div class="onb-desc">'+step.desc+'</div>';

  if(step.type==='text'){
    html+='<input class="onb-input" id="onb-in" placeholder="'+step.ph+'" value="'+(onbData[step.key]||'')+'" oninput="onbCheck()"/>';
  }else if(step.type==='num'){
    html+='<input class="onb-input" id="onb-in" type="number" inputmode="numeric" placeholder="'+step.ph+'" value="'+(onbData[step.key]||'')+'" oninput="onbCheck()"/>';
    html+='<div class="onb-unit">'+step.unit+'</div>';
  }else if(step.type==='height'){
    const ft=onbData.heightFt||'', inch=onbData.heightIn||'';
    html+='<div class="onb-row"><div><input class="onb-input" id="onb-ft" type="number" inputmode="numeric" placeholder="5" value="'+ft+'" oninput="onbCheck()"/><div class="onb-unit">feet</div></div><div><input class="onb-input" id="onb-in" type="number" inputmode="numeric" placeholder="8" value="'+inch+'" oninput="onbCheck()"/><div class="onb-unit">inches</div></div></div>';
  }else if(step.type==='choice'){
    html+='<div class="onb-opts">';
    step.opts.forEach(o=>{
      const sel=onbData[step.key]===o[0]?'sel':'';
      html+='<button class="onb-opt '+sel+'" onclick="onbPick(\''+o[0]+'\')">'+o[1]+'<span class="tick">✓</span></button>';
    });
    html+='</div>';
  }
  html+='</div>';
  body.innerHTML=html;
  body.scrollTop=0;
  onbCheck();
  setTimeout(()=>{const inp=document.getElementById('onb-in');if(inp&&(step.type==='text'||step.type==='num'))inp.focus();},200);
}
function onbPick(val){
  const step=ONB[onbIdx];
  onbData[step.key]=val;
  renderOnb();
  setTimeout(onbNext,180);
}
function onbCheck(){
  const step=ONB[onbIdx];
  let ok=false;
  if(step.type==='choice'){ok=!!onbData[step.key];}
  else if(step.type==='height'){
    const ft=document.getElementById('onb-ft'); const inc=document.getElementById('onb-in');
    ok=ft&&ft.value&&inc&&inc.value!=='';
  }else{
    const inp=document.getElementById('onb-in');
    ok=inp&&inp.value.trim()!=='';
    if(ok&&step.type==='num'){const v=+inp.value;ok=v>=(step.min||0)&&v<=(step.max||9999);}
  }
  document.getElementById('onb-next').disabled=!ok;
}
function onbCapture(){
  const step=ONB[onbIdx];
  if(step.type==='height'){
    onbData.heightFt=+document.getElementById('onb-ft').value;
    onbData.heightIn=+document.getElementById('onb-in').value;
    onbData.height=onbData.heightFt*12+onbData.heightIn; // total inches
  }else if(step.type!=='choice'){
    const inp=document.getElementById('onb-in');
    onbData[step.key]=step.type==='num'?+inp.value:inp.value.trim();
  }
}
function onbBack(){onbCapture();if(onbIdx>0){onbIdx--;renderOnb();}}
function onbNext(){
  const step=ONB[onbIdx];
  onbCapture();
  // validate
  if(step.type==='choice'&&!onbData[step.key])return;
  if(onbIdx<ONB.length-1){onbIdx++;renderOnb();}
  else{finishOnboarding();}
}

function finishOnboarding(){
  document.getElementById('onb-fill').style.width='100%';
  // build plan
  const plan=computePlan(onbData);
  USER=Object.assign({},onbData,plan,{onboarded:true,code:CURRENT_CODE,created:Date.now()});
  // seed first weight
  DATA.weights=[{date:todayStr(),weight:onbData.weight}];
  saveProfile(); saveData();
  showPlanReveal();
}

/* ============================================================
   PLAN MATH (Mifflin-St Jeor + goal adjustments)
============================================================ */
function computePlan(d){
  // d.weight lbs, d.height inches, d.age
  const kg=d.weight*0.453592;
  const cm=d.height*2.54;
  let bmr;
  if(d.sex==='male') bmr=10*kg+6.25*cm-5*d.age+5;
  else bmr=10*kg+6.25*cm-5*d.age-161;
  // activity factor from training days
  const af={3:1.4,4:1.48,5:1.55,6:1.62}[+d.days]||1.45;
  let tdee=bmr*af;
  // goal adjustment
  let cals, proteinPerLb, label;
  if(d.goal==='cut'){cals=tdee-600;proteinPerLb=1.1;label='Aggressive Cut';}
  else if(d.goal==='recomp'){cals=tdee-350;proteinPerLb=1.0;label='Recomposition';}
  else if(d.goal==='bulk'){cals=tdee+250;proteinPerLb=0.9;label='Lean Bulk';}
  else{cals=tdee;proteinPerLb=0.85;label='Maintain & Build';}
  // safety floor — never recommend an unhealthily low intake
  const floor=d.sex==='male'?1500:1200;
  if(cals<floor)cals=floor;
  cals=Math.round(cals/10)*10;
  // protein based on weight (lean-ish)
  let protein=Math.round(d.weight*proteinPerLb/5)*5;
  // fat ~25% cals
  const fat=Math.round((cals*0.25)/9/5)*5;
  // carbs = remainder
  const carbs=Math.round((cals-protein*4-fat*9)/4/5)*5;
  return {
    bmr:Math.round(bmr),tdee:Math.round(tdee),
    calGoal:cals,proteinGoal:protein,carbGoal:Math.max(carbs,40),fatGoal:fat,
    planLabel:label
  };
}

function showPlanReveal(){
  document.getElementById('onb-step').textContent='Your plan is ready';
  const body=document.getElementById('onb-body');
  body.innerHTML='<div class="plan-reveal fadein">'+
    '<h2>'+USER.name.split(' ')[0]+', here\'s your plan</h2>'+
    '<div class="pr-sub">'+USER.planLabel+' · '+USER.weight+' → '+USER.goalWeight+' lbs</div>'+
    '<div class="plan-stats">'+
      '<div class="plan-stat"><div class="v">'+USER.calGoal+'</div><div class="l">Daily Calories</div></div>'+
      '<div class="plan-stat teal"><div class="v">'+USER.proteinGoal+'g</div><div class="l">Protein / day</div></div>'+
      '<div class="plan-stat"><div class="v">'+USER.carbGoal+'g</div><div class="l">Carbs / day</div></div>'+
      '<div class="plan-stat teal"><div class="v">'+USER.fatGoal+'g</div><div class="l">Fat / day</div></div>'+
    '</div>'+
    '<div class="onb-desc" style="margin-top:20px;text-align:center;">These are calculated from your stats using the Mifflin-St Jeor formula. You can adjust them anytime in your profile.</div>'+
  '</div>';
  const nx=document.getElementById('onb-next');
  nx.textContent='Start Training →'; nx.disabled=false; nx.onclick=()=>{document.getElementById('onb-overlay').classList.remove('show');document.getElementById('onb-next').onclick=onbNext;enterApp();};
  document.getElementById('onb-back').style.display='none';
}

/* ============================================================
   HELPERS
============================================================ */
function todayStr(d){d=d||new Date();return d.toISOString().slice(0,10);}
function prettyDate(s){const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
function shortDate(s){const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function getDay(date){date=date||todayStr();if(!DATA.days[date])DATA.days[date]={protein:0,calories:0,carbs:0,fat:0,note:''};return DATA.days[date];}
function fmt(n){return Math.round(n).toLocaleString();}
function epley(w,r){return r<=1?w:Math.round(w*(1+r/30));}

   ENTER APP / NAV
============================================================ */

  {id:'today',ico:'🔥',label:'Today'},
  {id:'train',ico:'💪',label:'Coach'},
  {id:'eat',ico:'💬',label:'Eat'},
  {id:'journal',ico:'📖',label:'Journal'},

];

  document.getElementById('app').classList.remove('hide');
  document.getElementById('h-sub').textContent=USER.planLabel+' · '+(USER.name?USER.name.split(' ')[0]:'');
  renderNav();
  go('today');

}

  document.getElementById('nav').innerHTML=TABS.map(t=>
    '<div class="nav-item'+(activeTab===t.id?' active':'')+'" onclick="go(\''+t.id+'\')"><span>'+t.ico+'</span><span class="nl">'+t.label+'</span></div>'
  ).join('');
}
function go(tab){
  activeTab=tab; renderNav();
  const c=document.getElementById('content'); c.scrollTop=0;
  if(tab==='today')renderToday(c);
  else if(tab==='train')renderTrain(c);
  else if(tab==='eat')renderEat(c);
  else if(tab==='journal')renderJournal(c);
  else if(tab==='progress')renderProgress(c);
}

/* ============================================================
   STREAK
============================================================ */
function updateStreak(){
  const dates=Object.keys(DATA.workouts).sort().reverse();
  let streak=0; let cur=new Date();
  // simplistic: consecutive days back from today with a workout
  for(let i=0;i<60;i++){
    const ds=todayStr(cur);
    if(DATA.workouts[ds]){streak++;}
    else if(i>0){break;}
    cur.setDate(cur.getDate()-1);
  }
  const badge=document.getElementById('streak-badge');
  if(streak>0){badge.style.display='inline-flex';document.getElementById('streak-n').textContent=streak;}
  else badge.style.display='none';
}

function ring(val,goal,color,unit,label){
  const pct=Math.min(val/goal,1); const r=54,c=2*Math.PI*r; const off=c*(1-pct);
  return '<div class="ring-wrap"><div class="ring-box"><svg width="124" height="124" viewBox="0 0 124 124">'+
    '<circle cx="62" cy="62" r="'+r+'" fill="none" stroke="var(--surface2)" stroke-width="11"/>'+
    '<circle cx="62" cy="62" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 62 62)" style="transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)"/>'+
    '</svg><div class="ring-val"><div class="ring-num">'+fmt(val)+'</div><div class="ring-unit">/ '+fmt(goal)+unit+'</div></div></div>'+
    '<div class="ring-lbl">'+label+'</div></div>';
}
function macroBar(name,val,goal,color){
  const pct=Math.min(val/goal*100,100);
  return '<div class="macro-row"><div class="macro-head"><span class="macro-name">'+name+'</span><span class="macro-val">'+fmt(val)+' / '+fmt(goal)+'g</span></div>'+
    '<div class="macro-track"><div class="macro-prog" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
}

/* ============================================================
   AI CALL (via Cloudflare Worker)
============================================================ */
async function callAI(messages,system,maxTokens){
  const body={model:'claude-haiku-4-5-20251001',max_tokens:maxTokens||1024,messages};
  if(system)body.system=system;
  const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('AI request failed ('+r.status+')');
  const data=await r.json();
  if(data.error)throw new Error(data.error.message||'AI error');
  const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return txt;
}

async function generateWorkout(){
  const f=document.getElementById('coach-focus');if(f)coachState.focus=f.value;
  if(!coachState.time||!coachState.feel)return;
  const c=document.getElementById('content');
  c.innerHTML='<div class="empty fadein"><div class="spinner" style="width:34px;height:34px;border-width:4px;margin-bottom:18px;"></div><div class="et">Designing your session…</div><div class="ed">Reading your history and gym setup</div></div>';

  // build history summary
  const dates=Object.keys(DATA.workouts).sort().reverse().slice(0,4);
  const hist=dates.map(d=>{const w=DATA.workouts[d];return shortDate(d)+': '+w.title+' ('+[...muscleGroupsFrom(w)].join(', ')+')';}).join('; ')||'No prior sessions logged.';

  const equip={fullgym:'a full commercial gym (power rack, barbells, dumbbells to 75lb+, full cable/functional trainer, lat pulldown, seated row, leg machines, kettlebells, benches, treadmills)',
    homegym:'a home gym (adjustable dumbbells, full kettlebell set, barbell, bench, pull-up bar)',
    minimal:'minimal equipment (bodyweight, bands, maybe light dumbbells)'}[USER.place]||'a full gym';

  const sys='You are an elite strength coach building ONE workout. Respond ONLY with valid JSON, no markdown, no preamble. '+
    'Schema: {"title":"short session name","note":"1-2 sentence coach note referencing their history/recovery","exercises":[{"name":"exercise name","muscles":["Chest","Shoulders"],"sets":3,"reps":"8-12","rest":90,"cue":"one short form cue"}]}. '+
    'Valid muscle tags ONLY: Chest, Back, Shoulders, Biceps, Triceps, Forearms, Core, Quads, Hamstrings, Glutes, Calves. '+
    'Pick exercises that fit their equipment. Compounds first, then accessories, then one conditioning finisher. '+
    'Size the number of exercises to the time available (45min=5, 60min=6, 75min=7, 90min=8).';

  const usr='Client: '+USER.name+', '+USER.sex+', '+USER.age+'yo, '+USER.weight+'lbs, goal: '+USER.planLabel+'. '+
    'Equipment: '+equip+'. Trains '+USER.days+'x/week. '+
    'Recent sessions: '+hist+'. '+
    'Today: has '+coachState.time+' minutes, feeling '+coachState.feel+'. '+
    (coachState.focus?'Special request: '+coachState.focus+'. ':'')+
    'Build today\'s workout. Avoid repeating the exact muscles hammered in the most recent session — train complementary groups for recovery. Return JSON only.';

  try{
    let txt=await callAI([{role:'user',content:usr}],sys,1500);
    txt=txt.replace(/```json/g,'').replace(/```/g,'').trim();
    const wk=JSON.parse(txt);
    // normalize into our structure
    wk.exercises=wk.exercises.map(e=>({
      name:e.name,muscles:e.muscles||[],targetSets:e.sets||3,reps:e.reps||'8-12',rest:e.rest||90,cue:e.cue||'',
      sets:Array.from({length:e.sets||3},()=>({w:'',r:''}))
    }));
    wk.date=todayStr();wk.created=Date.now();
    DATA.workouts[todayStr()]=wk;
    saveData();

    renderWorkout(c,wk);
    updateStreak();
  }catch(e){

  }
}

function workoutVolume(w){let v=0;w.exercises.forEach(e=>{(e.sets||[]).forEach(s=>{if(s.w&&s.r)v+=(+s.w)*(+s.r);});});return v;}

function renderWorkout(c,w){
  let html='<div class="fadein">';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'+

      const orm=(st.w&&st.r)?epley(+st.w,+st.r)+' 1RM':'';

        '<input class="set-in" inputmode="numeric" placeholder="lbs" value="'+(st.w||'')+'" onchange="setLog('+ei+','+si+',\'w\',this.value)"/>'+
        '<span class="set-x">×</span>'+
        '<input class="set-in" inputmode="numeric" placeholder="reps" value="'+(st.r||'')+'" onchange="setLog('+ei+','+si+',\'r\',this.value)"/>'+
        '<span class="set-1rm">'+orm+'</span></div>';
    });
    html+='<button class="btn btn-ghost" style="font-size:12px;padding:8px 0;" onclick="addSet('+ei+')">+ Add set</button>';
    html+='</div>';
  });

  html+='<button class="btn btn-teal btn-full" style="padding:17px;font-size:15px;margin-top:6px;" onclick="finishWorkout()">✓ Finish & Log Session</button>';

function setLog(ei,si,k,v){
  DATA.workouts[todayStr()].exercises[ei].sets[si][k]=v;
  saveData();
  // refresh just this exercise's 1RM + PR border
  renderWorkout(document.getElementById('content'),DATA.workouts[todayStr()]);
}
function addSet(ei){DATA.workouts[todayStr()].exercises[ei].sets.push({w:'',r:''});saveData();renderWorkout(document.getElementById('content'),DATA.workouts[todayStr()]);}
function lastTimeFor(name){
  const dates=Object.keys(DATA.workouts).filter(d=>d<todayStr()).sort().reverse();
  for(const d of dates){
    const w=DATA.workouts[d];const ex=w.exercises.find(e=>e.name===name);
    if(ex){const done=ex.sets.filter(s=>s.w&&s.r);if(done.length)return done.map(s=>s.w+'×'+s.r).join(' · ');}
  }
  return null;
}
function bestOrmFor(name,beforeToday){
  const dates=Object.keys(DATA.workouts).filter(d=>beforeToday?d<todayStr():true).sort();
  let best=0;
  dates.forEach(d=>{const w=DATA.workouts[d];const ex=w.exercises.find(e=>e.name===name);if(ex)ex.sets.forEach(s=>{if(s.w&&s.r){const o=epley(+s.w,+s.r);if(o>best)best=o;}});});
  return best;
}
function checkPRflag(e){
  const prev=bestOrmFor(e.name,true);
  let cur=0;(e.sets||[]).forEach(s=>{if(s.w&&s.r){const o=epley(+s.w,+s.r);if(o>cur)cur=o;}});
  return cur>0&&cur>prev;
}

  else{html='<div id="wu-out"></div>';}
  openPop('Warm-up — '+e.name,html);
  if(lastW){document.getElementById('wu-out').innerHTML=warmupRamp(lastW);}
}
function calcWarmup(){const t=+document.getElementById('wu-target').value;if(t)document.getElementById('wu-out').innerHTML=warmupRamp(t);}
function warmupRamp(work){
  const sets=[['Empty bar / light',0.0,8],['40%',0.4,5],['60%',0.6,3],['80%',0.8,2]];
  let html='<div style="margin-top:14px;">';
  sets.forEach(s=>{const w=s[1]===0?'Bar':Math.round(work*s[1]/5)*5+' lbs';html+='<div class="stepper" style="margin-bottom:8px;"><span class="step-lbl">'+s[0]+'</span><span class="step-v" style="min-width:auto;">'+w+' × '+s[2]+'</span></div>';});
  html+='<div class="stepper" style="border-color:var(--sapphire);"><span class="step-lbl">Working set</span><span class="step-v" style="min-width:auto;color:var(--sapphire);">'+work+' lbs</span></div></div>';
  return html;
}
function showPlates(ei){
  openPop('Plate Calculator','<input class="onb-input" id="pl-target" type="number" inputmode="numeric" placeholder="Total weight (lbs)" style="margin-bottom:12px;"/><button class="btn btn-fill btn-full" onclick="calcPlates()">Show plates per side</button><div id="pl-out" style="margin-top:14px;"></div>');
}
function calcPlates(){
  const total=+document.getElementById('pl-target').value;
  const bar=45;
  if(total<bar){document.getElementById('pl-out').innerHTML='<div style="color:var(--ink2);font-size:13px;">Below bar weight (45 lbs).</div>';return;}
  let perSide=(total-bar)/2;
  const plates=[45,35,25,10,5,2.5];const colors={45:'#1E4488',35:'#C9A24A',25:'#0E9E8E',10:'#5A57B0',5:'#566076',2.5:'#97A1B4'};
  let out=[];plates.forEach(p=>{while(perSide>=p){out.push(p);perSide=Math.round((perSide-p)*10)/10;}});
  let html='<div style="font-size:13px;color:var(--ink2);margin-bottom:10px;">45 lb bar + per side:</div><div style="display:flex;flex-wrap:wrap;gap:8px;">';
  if(out.length)out.forEach(p=>{html+='<span style="background:'+colors[p]+';color:#fff;font-weight:800;font-size:13px;padding:9px 13px;border-radius:9px;">'+p+'</span>';});
  else html+='<span style="color:var(--dim);">Just the bar</span>';
  html+='</div>';
  document.getElementById('pl-out').innerHTML=html;
}

function startTimer(sec){

    html+='<span class="qp" onclick="quickEat(\''+q.replace(/'/g,"\\'")+'\')">'+q+'</span>';
  });
  html+='</div>';
  html+='<div class="chat-wrap" id="chat-wrap">';
  if(chatHistory.length===0){
    html+='<div class="msg ai">Hey '+(USER.name?USER.name.split(' ')[0]:'')+'! Just type what you ate in plain English — like "grilled chicken breast, rice, and a side salad" — and I\'ll break down the calories and macros. Then you can log it with one tap.</div>';
  }
  chatHistory.forEach(m=>{html+='<div class="msg '+m.role+'">'+m.html+'</div>';});
  html+='</div>';
  html+='<div id="meal-action"></div>';
  html+='<div class="chat-input-row"><textarea class="chat-input" id="eat-in" placeholder="What did you eat?" rows="1"></textarea><button class="chat-send" onclick="sendEat()">↑</button></div>';
  html+='</div>';

}
function quickEat(t){document.getElementById('eat-in').value=t;sendEat();}
async function sendEat(){
  const inp=document.getElementById('eat-in');const txt=inp.value.trim();if(!txt)return;
  inp.value='';
  chatHistory.push({role:'user',html:txt});
  renderEat(document.getElementById('content'));
  const wrap=document.getElementById('chat-wrap');
  wrap.innerHTML+='<div class="msg ai" id="thinking"><span class="spinner"></span></div>';
  wrap.scrollTop=wrap.scrollHeight;

  const sys='You are a nutrition assistant. The user describes food they ate. Estimate macros. '+
    'Respond ONLY with valid JSON, no markdown: {"name":"short meal name","calories":N,"protein":N,"carbs":N,"fat":N,"note":"one short helpful line"}. '+
    'Be realistic. The user knows these NYC spots: Naya (Mediterranean), Sweetgreen, Dill & Parsley, a Thai khao man gai cart. '+
    'Naya double chicken bowl ~540cal/62g protein. Sweetgreen typical bowl ~700cal/45g.';
  try{
    let res=await callAI([{role:'user',content:txt}],sys,500);
    res=res.replace(/```json/g,'').replace(/```/g,'').trim();
    const meal=JSON.parse(res);
    lastMeal=meal;
    document.getElementById('thinking').remove();
    const mealHtml='<div style="font-weight:700;margin-bottom:8px;">'+meal.name+'</div>'+
      '<div class="meal-macros"><div class="meal-macro"><div class="v">'+meal.calories+'</div><div class="l">cal</div></div>'+
      '<div class="meal-macro"><div class="v">'+meal.protein+'</div><div class="l">protein</div></div>'+
      '<div class="meal-macro"><div class="v">'+meal.carbs+'</div><div class="l">carbs</div></div>'+
      '<div class="meal-macro"><div class="v">'+meal.fat+'</div><div class="l">fat</div></div></div>'+
      (meal.note?'<div style="font-size:12.5px;color:var(--ink2);">'+meal.note+'</div>':'');
    chatHistory.push({role:'ai',html:mealHtml});
    renderEat(document.getElementById('content'));
    document.getElementById('meal-action').innerHTML='<button class="btn btn-teal btn-full" style="margin-top:10px;" onclick="logMeal()">+ Log this meal to today</button>';
    document.getElementById('content').scrollTop=document.getElementById('content').scrollHeight;
  }catch(e){
    const th=document.getElementById('thinking');if(th)th.remove();
    chatHistory.push({role:'ai',html:'Sorry, I had trouble with that: '+e.message+'. Try rephrasing?'});
    renderEat(document.getElementById('content'));
  }
}
function logMeal(){
  if(!lastMeal)return;
  const d=getDay();
  d.protein+=+lastMeal.protein;d.calories+=+lastMeal.calories;d.carbs+=+lastMeal.carbs||0;d.fat+=+lastMeal.fat||0;
  const t=todayStr();if(!DATA.meals[t])DATA.meals[t]=[];
  DATA.meals[t].push({name:lastMeal.name,protein:+lastMeal.protein,calories:+lastMeal.calories,carbs:+lastMeal.carbs||0,fat:+lastMeal.fat||0,time:Date.now()});
  saveData();
  document.getElementById('meal-action').innerHTML='<div style="text-align:center;color:var(--teal);font-weight:700;font-size:14px;padding:10px;">✓ Logged! View it on Today.</div>';
  lastMeal=null;
}

        '<div class="jrn-detail">'+m.map(x=>'• '+x.name+' — '+x.protein+'g / '+x.calories+'cal').join('<br/>')+'</div></div>';
    }else if(it.type==='wt'){
      html+='<div class="jrn-item"><div class="jrn-date">'+prettyDate(it.date)+' <span class="jrn-tag wt">Weigh-in</span></div>'+

function renderProgress(c){
  const weights=[...DATA.weights].sort((a,b)=>a.date.localeCompare(b.date));
  const cur=weights.length?weights[weights.length-1].weight:USER.weight;
  const start=USER.weight;const goal=USER.goalWeight;
  const toGo=(cur-goal).toFixed(1);

  let html='<div class="fadein"><div class="greeting" style="font-size:25px;">Progress</div><div class="gdate">Toward '+goal+' lbs.</div>';
  html+='<div class="card"><div class="tiles">'+
    '<div class="tile"><div class="tv">'+cur+'</div><div class="tl">Current</div></div>'+
    '<div class="tile"><div class="tv">'+goal+'</div><div class="tl">Goal</div></div>'+
    '<div class="tile"><div class="tv">'+(toGo>0?toGo:'0')+'</div><div class="tl">To go</div></div></div>';
  html+='<button class="btn btn-fill btn-full" style="margin-top:14px;" onclick="openWeighIn()">+ Log weigh-in</button></div>';

  // chart
  if(weights.length>1){
    html+='<div class="card"><div class="card-t">Bodyweight Trend</div>'+weightChart(weights,goal)+'</div>';
  }
  // projection
  if(weights.length>=2){
    const proj=projectGoal(weights,goal);
    if(proj)html+='<div class="card" style="background:var(--surface2);"><div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;color:var(--ink);">'+proj+'</div></div>';
  }

  html+='</div>';
  c.innerHTML=html;
}
function openWeighIn(){

    '<input class="onb-input" id="wi-weight" type="number" inputmode="decimal" placeholder="Weight (lbs)" style="margin-bottom:12px;"/>'+
    '<button class="btn btn-fill btn-full" onclick="saveWeighIn()">Save</button>');
}
function saveWeighIn(){
  const w=+document.getElementById('wi-weight').value;if(!w)return;
  const t=todayStr();
  DATA.weights=DATA.weights.filter(x=>x.date!==t);
  DATA.weights.push({date:t,weight:w});
  saveData();closePop();go('progress');
}
function weightChart(weights,goal){
  const w=300,h=140,pad=30;
  const vals=weights.map(x=>x.weight);
  const min=Math.min(...vals,goal)-2,max=Math.max(...vals,goal)+2;
  const xs=(i)=>pad+(i/(weights.length-1))*(w-pad*2);
  const ys=(v)=>h-pad-((v-min)/(max-min))*(h-pad*2);
  let path=weights.map((p,i)=>(i?'L':'M')+xs(i)+' '+ys(p.weight)).join(' ');
  const goalY=ys(goal);
  let html='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;">';
  html+='<line x1="'+pad+'" y1="'+goalY+'" x2="'+(w-pad)+'" y2="'+goalY+'" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  html+='<text x="'+(w-pad)+'" y="'+(goalY-5)+'" text-anchor="end" font-size="9" fill="var(--teal)" font-family="Manrope" font-weight="700">GOAL '+goal+'</text>';
  html+='<path d="'+path+'" fill="none" stroke="var(--sapphire)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  weights.forEach((p,i)=>{html+='<circle cx="'+xs(i)+'" cy="'+ys(p.weight)+'" r="3.5" fill="var(--sapphire)"/>';});
  html+='</svg>';
  return html;
}
function projectGoal(weights,goal){
  const first=weights[0],last=weights[weights.length-1];
  const days=(new Date(last.date)-new Date(first.date))/86400000;
  if(days<1)return null;
  const rate=(last.weight-first.weight)/days; // lbs/day
  if(Math.abs(rate)<0.005)return 'Weight holding steady — keep dialing in protein & training.';
  const remaining=last.weight-goal;
  if((remaining>0&&rate>=0)||(remaining<0&&rate<=0))return 'Trending the wrong way for your goal — worth reviewing calories.';
  const daysLeft=Math.abs(remaining/rate);
  const eta=new Date(Date.now()+daysLeft*86400000);
  return 'On pace for '+goal+' lbs by '+eta.toLocaleDateString('en-US',{month:'long',day:'numeric'})+' · ~'+Math.abs(rate*7).toFixed(1)+' lb/wk';
}
