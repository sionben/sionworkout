<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#FF6A2C"/>
<title>RECOMP</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Archivo+Expanded:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F4F1EA;--surface:#FFFFFF;--surface2:#FBF9F4;
  --ink:#1A1822;--ink2:#4A4754;--dim:#8B8794;--line:#EAE5DB;--line2:#DED8CC;
  --o1:#FF7A3D;--o2:#FF5E5E;--orange:#FF6A2C;
  --green:#12B886;--greenL:#E4F7F0;--blue:#3B82F6;--blueL:#E8F0FE;
  --purple:#7C5CFC;--purpleL:#EFEAFE;--gold:#F5A623;--red:#FF5252;
  --grad:linear-gradient(135deg,#FF7A3D 0%,#FF5E5E 100%);
  --gradGold:linear-gradient(135deg,#FFB13D,#FF7A3D);
  --gradGreen:linear-gradient(135deg,#16C79A,#12B886);
  --gradBlue:linear-gradient(135deg,#5B9BFF,#3B82F6);
  --sh:0 4px 20px rgba(26,24,34,.06);--shHover:0 8px 30px rgba(255,106,44,.18);
  --nav-h:76px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;}
body::before{content:'';position:fixed;top:-160px;right:-120px;width:420px;height:420px;background:radial-gradient(circle,rgba(255,122,61,.16),transparent 68%);pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;bottom:-160px;left:-120px;width:420px;height:420px;background:radial-gradient(circle,rgba(124,92,252,.10),transparent 68%);pointer-events:none;z-index:0;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;position:relative;z-index:1;}
#header{padding:16px 20px 10px;flex-shrink:0;position:relative;z-index:10;}
.header-row{display:flex;justify-content:space-between;align-items:center;}
.logo{font-family:'Archivo Expanded';font-weight:900;font-size:25px;letter-spacing:-.5px;color:var(--ink);}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.streak-badge{display:flex;align-items:center;gap:6px;background:var(--surface);box-shadow:var(--sh);padding:8px 14px;border-radius:30px;}
.streak-flame{font-size:16px;}.streak-num{font-family:'Archivo';font-weight:800;font-size:17px;color:var(--orange);}.streak-lbl{font-size:10px;color:var(--dim);font-weight:600;}
.motivate{font-size:13px;color:var(--ink2);margin-top:8px;font-weight:500;}
.motivate b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;}

#timer-bar{display:none;flex-shrink:0;margin:6px 16px 0;padding:12px 16px;border-radius:18px;background:var(--gradGreen);box-shadow:0 6px 20px rgba(18,184,134,.3);align-items:center;justify-content:space-between;gap:10px;}
#timer-bar.on{display:flex;}
.timer-time{font-family:'Archivo';font-weight:800;font-size:26px;color:#fff;min-width:58px;}
.timer-presets{display:flex;gap:5px;}
.tpreset{padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.22);border:none;color:#fff;font-size:11px;font-weight:700;cursor:pointer;}
.tpreset.active{background:#fff;color:var(--green);}
.timer-x{color:#fff;font-size:18px;cursor:pointer;padding:4px 6px;opacity:.8;}

#content{flex:1 1 auto;overflow-y:scroll;overflow-x:hidden;padding-bottom:124px;min-height:0;-webkit-overflow-scrolling:touch;}
#content.chat-mode{overflow:hidden;padding-bottom:0;display:flex;flex-direction:column;}

#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:var(--nav-h);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:8px;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;cursor:pointer;color:var(--dim);transition:.2s;position:relative;}
.nav-btn.active{color:var(--orange);}
.nav-btn.active .nav-icon{transform:translateY(-2px) scale(1.12);}
.nav-icon{font-size:20px;line-height:1;transition:.2s;}.nav-label{font-size:10px;font-weight:700;}

.card{background:var(--surface);border-radius:22px;padding:18px;margin:12px 16px;box-shadow:var(--sh);}
.card-label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin-bottom:12px;font-weight:700;}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
.row+.row{border-top:1px solid var(--line);}

.date-nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 16px 2px;}
.date-arrow{width:40px;height:40px;border-radius:14px;background:var(--surface);box-shadow:var(--sh);border:none;color:var(--ink2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.date-center{text-align:center;min-width:150px;cursor:pointer;}
.date-str{font-family:'Archivo';font-weight:800;font-size:19px;}.date-sub{font-size:10px;letter-spacing:.5px;text-transform:uppercase;margin-top:1px;font-weight:700;}

.rings{display:flex;justify-content:space-around;padding:12px 0 8px;}
.ring-box{position:relative;width:140px;height:140px;}
.ring-svg{transform:rotate(-90deg);}
.ring-fg{fill:none;stroke-linecap:round;transition:stroke-dasharray .8s cubic-bezier(.34,1.56,.64,1);}
.ring-bg{fill:none;stroke:var(--line);}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-val{font-family:'Archivo';font-weight:900;font-size:36px;line-height:1;}.ring-sub{font-size:11px;color:var(--dim);margin-top:3px;font-weight:600;}.ring-label{font-size:10px;font-weight:800;letter-spacing:.5px;margin-top:3px;}

.stat-strip{display:flex;gap:11px;padding:6px 16px;}
.mini-stat{flex:1;background:var(--surface);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:var(--sh);}
.mini-val{font-family:'Archivo';font-weight:900;font-size:24px;line-height:1;}.mini-lbl{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);margin-top:5px;font-weight:700;}

.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:#fff;border:none;border-radius:16px;padding:16px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Plus Jakarta Sans';width:100%;box-shadow:var(--shHover);}
.btn-primary:disabled{opacity:.6;}
.btn-ghost{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--ink2);border:1px solid var(--line2);border-radius:16px;padding:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans';width:100%;}
.btn-icon{width:40px;height:40px;border-radius:13px;background:var(--surface2);border:1px solid var(--line);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.stepper{display:flex;align-items:center;gap:6px;}
.step-btn{width:38px;height:38px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
.step-input{width:76px;text-align:center;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 4px;font-size:17px;font-family:'Archivo';font-weight:800;outline:none;}
.step-unit{font-size:12px;color:var(--dim);font-weight:600;}
input[type=number]{-moz-appearance:textfield;}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
textarea{width:100%;min-height:64px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:12px;font-size:14px;resize:vertical;outline:none;font-family:'Plus Jakarta Sans';}
textarea::placeholder{color:var(--dim);}

.ex-card{margin:10px 16px;border-radius:20px;padding:17px;background:var(--surface);box-shadow:var(--sh);position:relative;overflow:hidden;}
.ex-card.done{box-shadow:0 4px 20px rgba(245,166,35,.2);}
.ex-card.done::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gradGold);}
.ex-card.complex::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#7C5CFC,#B08CF0);}
.ex-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:10px;}
.ex-name{font-family:'Archivo';font-weight:800;font-size:18px;color:var(--ink);flex:1;line-height:1.15;}
.ex-badge{font-size:10px;font-weight:800;letter-spacing:.3px;padding:6px 11px;border-radius:20px;white-space:nowrap;}
.badge-gold{background:var(--gradGold);color:#fff;}.badge-purple{background:var(--purpleL);color:var(--purple);}.badge-blue{background:var(--blueL);color:var(--blue);}
.badge-pr{background:var(--grad);color:#fff;animation:prpulse 1s ease;}
@keyframes prpulse{0%{transform:scale(.6);opacity:0}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.ex-sets-label{font-size:11px;color:var(--dim);margin-bottom:12px;font-weight:600;}
.ex-muscle{display:inline-block;font-size:10px;font-weight:700;color:var(--purple);background:var(--purpleL);padding:3px 9px;border-radius:12px;margin-bottom:10px;}
.demo-btn{display:inline-flex;align-items:center;gap:5px;background:var(--orange);color:#fff;border:none;font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;cursor:pointer;margin:0 0 10px 6px;}
.ex-meta{display:flex;gap:16px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
.ex-meta-item{font-size:11px;color:var(--dim);font-weight:600;}.ex-meta-val{font-family:'Archivo';font-weight:800;font-size:14px;color:var(--ink);}
.ex-cue{font-size:11px;color:var(--orange);margin-top:8px;font-style:italic;font-weight:500;}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.set-label{font-size:12px;color:var(--dim);width:40px;font-weight:700;}
.set-input{flex:1;text-align:center;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 4px;font-size:17px;font-family:'Archivo';font-weight:800;outline:none;min-width:0;transition:.2s;}
.set-input.at-top{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,106,44,.18);}
.set-x{font-size:14px;color:var(--dim);}.set-1rm{font-size:10px;color:var(--dim);width:54px;text-align:right;font-weight:600;}.set-1rm b{font-family:'Archivo';font-weight:800;color:var(--orange);font-size:13px;}
.act-row{display:flex;gap:8px;margin-top:11px;}
.timer-start-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;background:var(--greenL);border:none;border-radius:13px;color:var(--green);font-size:12px;font-weight:700;cursor:pointer;}
.plate-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;background:var(--surface2);border:1px solid var(--line);border-radius:13px;color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;}
.complex-seq{background:var(--purpleL);border-radius:14px;padding:14px;margin:8px 0;}
.complex-step{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(124,92,252,.12);}
.complex-step:last-child{border-bottom:none;padding-bottom:0;}
.complex-num{font-family:'Archivo';font-weight:800;font-size:16px;color:var(--purple);width:18px;}.complex-move{font-size:13px;color:var(--ink);font-weight:500;}.complex-rep{font-family:'Archivo';font-weight:800;font-size:15px;color:var(--orange);margin-left:auto;}
.rounds-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.rounds-ctrl{display:flex;align-items:center;gap:10px;}.rounds-val{font-family:'Archivo';font-weight:900;font-size:24px;color:var(--ink);min-width:24px;text-align:center;}
.rest-note{font-size:11px;color:var(--dim);margin-top:6px;font-style:italic;}
.finish-btn{margin:16px;}

.log-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
.log-name{font-size:13px;color:var(--ink);font-weight:500;}.log-sub{font-size:11px;color:var(--dim);}
.food-group-title{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--orange);margin:14px 0 8px;font-weight:800;}
.food-row-btn{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;margin-bottom:7px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;cursor:pointer;width:100%;}
.food-name{font-size:14px;color:var(--ink);font-weight:500;}.food-g{font-family:'Archivo';font-weight:800;font-size:18px;color:var(--orange);}

.stats-row{display:flex;gap:11px;padding:6px 16px 4px;}
.stat-box{flex:1;background:var(--surface);border-radius:18px;padding:16px 8px;text-align:center;box-shadow:var(--sh);}
.stat-label{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);font-weight:700;}.stat-val{font-family:'Archivo';font-weight:900;font-size:29px;margin-top:5px;line-height:1;}
.chart-wrap{margin:10px 16px;background:var(--surface);border-radius:20px;padding:18px 8px 10px;box-shadow:var(--sh);}
.chart-title{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:12px;padding-left:8px;font-weight:700;}
.history-item{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
.history-date{font-size:12px;color:var(--dim);width:74px;flex-shrink:0;font-weight:600;}
.history-vals{display:flex;gap:14px;flex:1;align-items:center;}.history-w{font-family:'Archivo';font-weight:800;font-size:18px;color:var(--ink);}
.hint-box{background:linear-gradient(135deg,rgba(255,122,61,.1),rgba(255,94,94,.06));border-radius:16px;padding:14px;margin:6px 16px 0;font-size:13px;color:var(--ink2);line-height:1.55;}

#sheet,#modal{position:fixed;inset:0;z-index:40;display:none;}
#sheet.open,#modal.open{display:flex;flex-direction:column;justify-content:flex-end;}
#modal.open{justify-content:center;align-items:center;}
.sheet-bg{position:absolute;inset:0;background:rgba(26,24,34,.4);backdrop-filter:blur(3px);}
.sheet-body{position:relative;background:var(--bg);border-radius:26px 26px 0 0;max-height:80vh;display:flex;flex-direction:column;}
.modal-body{position:relative;background:var(--surface);border-radius:24px;width:88%;max-width:380px;padding:22px;max-height:84vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.sheet-header{display:flex;justify-content:space-between;align-items:center;padding:20px 18px 12px;flex-shrink:0;}
.sheet-title{font-family:'Archivo';font-weight:800;font-size:21px;}
.sheet-close{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--dim);font-size:18px;cursor:pointer;}
.sheet-list{overflow-y:auto;padding:0 16px 24px;flex:1;}

.equip-cat{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--orange);font-weight:800;margin:16px 0 8px;}.equip-cat:first-child{margin-top:4px;}
.equip-tags{display:flex;flex-wrap:wrap;gap:7px;}.equip-tag{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;color:var(--ink);font-weight:500;}

.plate-input-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.plate-result{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0;min-height:70px;align-items:center;}
.plate{display:flex;align-items:center;justify-content:center;border-radius:8px;font-family:'Archivo';font-weight:800;color:#fff;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.2);}
.plate-empty{color:var(--dim);font-size:13px;}.plate-per-side{text-align:center;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600;}

.demo-stage{background:var(--surface2);border-radius:18px;padding:10px;margin:10px 0 14px;display:flex;align-items:center;justify-content:center;}
.demo-cues{list-style:none;}.demo-cues li{font-size:13px;color:var(--ink2);padding:7px 0 7px 24px;position:relative;line-height:1.4;border-bottom:1px solid var(--line);}.demo-cues li:last-child{border-bottom:none;}
.demo-cues li::before{content:'';position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:50%;background:var(--grad);}

.summary-hero{text-align:center;padding:6px 0 16px;}
.summary-title{font-family:'Archivo Expanded';font-weight:900;font-size:28px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:14px 0;}
.summary-stat{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:15px;text-align:center;}
.summary-num{font-family:'Archivo';font-weight:900;font-size:28px;}.summary-lbl{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);margin-top:4px;font-weight:700;}

/* COACH + CHAT */
.coach-hero{text-align:center;padding:18px 20px 6px;}
.coach-orb{width:72px;height:72px;border-radius:50%;background:var(--grad);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 8px 28px rgba(255,106,44,.35);animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.coach-title{font-family:'Archivo Expanded';font-weight:900;font-size:24px;}
.chat-wrap{display:flex;flex-direction:column;height:100%;min-height:0;}
.chat-messages{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:11px;min-height:0;}
.msg-row-user{display:flex;justify-content:flex-end;}
.msg-row-ai{display:flex;justify-content:flex-start;align-items:flex-end;gap:8px;}
.ai-avatar{width:30px;height:30px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-bottom:2px;}
.msg-bubble{max-width:82%;padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.55;}
.msg-user{background:var(--grad);color:#fff;border-radius:18px 18px 5px 18px;font-weight:500;}
.msg-ai{background:var(--surface);color:var(--ink);border-radius:18px 18px 18px 5px;box-shadow:var(--sh);}
.msg-macros{background:var(--greenL);border-radius:12px;padding:11px 13px;margin-top:11px;}
.macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.macro-item{text-align:center;padding:6px;}.macro-num{font-family:'Archivo';font-weight:900;font-size:22px;}.macro-name{font-size:10px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase;margin-top:1px;font-weight:700;}
.log-meal-btn{width:100%;margin-top:10px;padding:11px;background:var(--gradGreen);color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Plus Jakarta Sans';}
.log-meal-btn.done{background:var(--surface2);color:var(--dim);}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 10px;}
.chip{padding:11px 16px;border-radius:24px;background:var(--surface);border:1px solid var(--line2);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--sh);}
.chip:active{background:var(--grad);color:#fff;}
.typing-dots{display:flex;gap:4px;align-items:center;padding:4px 2px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:pulse 1.4s infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,60%,100%{opacity:.25}30%{opacity:1}}
.chat-input-bar{flex-shrink:0;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);display:flex;gap:8px;align-items:flex-end;padding-bottom:calc(10px + var(--nav-h));}
.chat-textarea{flex:1;background:var(--surface);border:1px solid var(--line2);color:var(--ink);border-radius:14px;padding:12px 15px;font-size:14px;outline:none;resize:none;font-family:'Plus Jakarta Sans';max-height:120px;min-height:46px;line-height:1.4;box-shadow:var(--sh);}
.chat-textarea::placeholder{color:var(--dim);}
.chat-send-btn{width:46px;height:46px;border-radius:14px;background:var(--grad);border:none;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0;box-shadow:var(--shHover);}
.chat-send-btn:disabled{background:var(--surface2);color:var(--dim);box-shadow:none;}
.coach-note{background:linear-gradient(135deg,rgba(255,122,61,.12),rgba(124,92,252,.08));border-radius:16px;padding:14px 16px;margin:12px 16px 4px;font-size:13.5px;color:var(--ink);line-height:1.55;font-weight:500;}
.coach-note b{color:var(--orange);}
.setup-card{margin:40px 20px;text-align:center;}
.setup-card .coach-orb{animation:none;}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}
::-webkit-scrollbar{width:0;}

function startTimer(secs){_ts=secs;if(_ti)clearInterval(_ti);_ti=setInterval(tick,1000);document.getElementById('timer-bar').classList.add('on');document.querySelectorAll('.tpreset').forEach(function(b){const v=b.textContent;b.classList.toggle('active',(v==='60s'&&secs===60)||(v==='90s'&&secs===90)||(v==='2m'&&secs===120)||(v==='3m'&&secs===180));});upTimer();}

async function callClaude(model,system,messages,maxTokens){
  const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model,max_tokens:maxTokens,system:system,messages:messages})});
  if(!res.ok){const t=await res.text();throw new Error('API '+res.status+': '+t.slice(0,120));}
  const data=await res.json();
  return data.content&&data.content[0]?data.content[0].text:'';
}

/* ════════ COACH ════════ */
function renderCoach(){
  if(!HAS_AI)return setupNeeded();
  const wk=DB.getWorkout(state.date);
  if(wk&&wk.exercises&&wk.exercises.length)return renderWorkout(wk);
  if(state.aiBusy)return '<div class="coach-hero"><div class="coach-orb">💪</div><div class="coach-title">Building your session…</div><div style="color:var(--dim);font-size:14px;margin-top:8px;">Designing around your gym &amp; recent training</div><div class="typing-dots" style="justify-content:center;margin-top:16px;"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
  /* coach Q&A flow */
  const co=state.coach;
  let html='<div class="faded"><div class="coach-hero"><div class="coach-orb">🏋️</div><div class="coach-title">Your AI Coach</div></div>';
  html+='<div class="msg-row-ai" style="padding:6px 16px;"><div class="ai-avatar">🤖</div><div class="msg-bubble msg-ai">Hey Sion 👋 Let&apos;s build today&apos;s session. How much time do you have?</div></div>';
  if(co.time){html+='<div class="msg-row-user" style="padding:2px 16px;"><div class="msg-bubble msg-user">'+co.time+' min</div></div>';
    html+='<div class="msg-row-ai" style="padding:6px 16px;"><div class="ai-avatar">🤖</div><div class="msg-bubble msg-ai">How&apos;s the body feeling today?</div></div>';}
  if(co.energy){html+='<div class="msg-row-user" style="padding:2px 16px;"><div class="msg-bubble msg-user">'+co.energy+'</div></div>';
    html+='<div class="msg-row-ai" style="padding:6px 16px;"><div class="ai-avatar">🤖</div><div class="msg-bubble msg-ai">Anything you want to focus on or work around? (optional)</div></div>';}
  /* chips for current step */
  if(!co.time){html+='<div class="chips"><div class="chip" onclick="coachSet(&apos;time&apos;,45)">45 min</div><div class="chip" onclick="coachSet(&apos;time&apos;,60)">60 min</div><div class="chip" onclick="coachSet(&apos;time&apos;,75)">75 min</div><div class="chip" onclick="coachSet(&apos;time&apos;,90)">90 min</div></div>';}
  else if(!co.energy){html+='<div class="chips"><div class="chip" onclick="coachSet(&apos;energy&apos;,&apos;Fresh&apos;)">💥 Fresh</div><div class="chip" onclick="coachSet(&apos;energy&apos;,&apos;Normal&apos;)">👍 Normal</div><div class="chip" onclick="coachSet(&apos;energy&apos;,&apos;Beat up / sore&apos;)">😮‍💨 Beat up</div></div>';}
  else{html+='<div style="padding:4px 16px 0;"><textarea id="coach-focus" placeholder="e.g. focus on arms, left shoulder is tight, skip heavy legs... (or leave blank)"></textarea></div>';
    html+='<div style="padding:10px 16px 0;"><button class="btn-primary" onclick="coachGenerate()">⚡ Generate my workout</button></div>';
    html+='<div style="padding:8px 16px 0;"><button class="btn-ghost" onclick="coachReset()">↻ Start over</button></div>';}
  html+='<div style="height:30px;"></div></div>';

function setupNeeded(){return '<div class="setup-card faded"><div class="coach-orb">🔑</div><h2 style="font-family:Archivo Expanded;font-weight:900;font-size:22px;margin:10px 0;">Connect your AI Coach</h2><p style="color:var(--ink2);font-size:14px;line-height:1.6;">Add your Anthropic API key to turn on AI workout generation and food macro tracking.<br><br>In <b>index.html</b> on GitHub, replace <b>YOUR_ANTHROPIC_API_KEY</b> at the top of the script with your key, then commit.</p></div>';}

function renderWorkout(wk){
  const prs=DB.getPRs();const vol=workoutVolume(wk);
  let html='<div class="faded"><div class="date-nav"><button class="date-arrow" onclick="shiftDay(-1)">&#8249;</button><div class="date-center" onclick="goToday()"><div class="date-str">'+prettyDate(state.date)+'</div><div class="date-sub" style="color:var(--orange)">'+(wk.duration||'')+(wk.duration?' MIN · ':'')+'AI SESSION</div></div><button class="date-arrow" onclick="shiftDay(1)">&#8250;</button></div>';
  html+='<div style="text-align:center;padding:2px 16px 0;"><div style="font-family:Archivo Expanded;font-weight:900;font-size:24px;">'+(wk.title||'Workout')+'</div>'+(wk.focus?'<div style="font-size:12px;color:var(--purple);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;">'+wk.focus+'</div>':'')+'</div>';
  if(wk.coachNote)html+='<div class="coach-note">🤖 '+wk.coachNote+'</div>';
  html+='<div class="stat-strip"><div class="mini-stat"><div class="mini-val" style="color:var(--orange)">'+(vol.vol>0?(vol.vol/1000).toFixed(1)+'k':'0')+'</div><div class="mini-lbl">Volume</div></div><div class="mini-stat"><div class="mini-val" style="color:var(--green)">'+vol.sets+'</div><div class="mini-lbl">Sets done</div></div><div class="mini-stat"><div class="mini-val" style="color:var(--blue)">'+calcStreak()+'</div><div class="mini-lbl">Streak</div></div></div>';
  wk.exercises.forEach(function(ex){
    if(ex.type==='complex'){const rounds=(wk.rounds&&wk.rounds[ex.id])||0;
      html+='<div class="ex-card complex"><div class="ex-header"><div class="ex-name">'+ex.name+'</div><div class="ex-badge badge-purple">FINISHER</div></div><button class="demo-btn" onclick="openDemo(&apos;'+(ex.pat||'swing')+'&apos;)">▶ How to</button>';
      if(ex.sequence)html+='<div class="complex-seq">'+ex.sequence.map(function(s,i){return '<div class="complex-step"><span class="complex-num">'+(i+1)+'</span><span class="complex-move">'+s.move+'</span><span class="complex-rep">'+s.rep+'</span></div>';}).join('')+'</div>';
      html+='<div class="rounds-row"><span style="font-size:13px;color:var(--dim);font-weight:600;">Rounds done</span><div class="rounds-ctrl"><button class="step-btn" onclick="setRounds(&apos;'+ex.id+'&apos;,'+Math.max(0,rounds-1)+')">&#8722;</button><span class="rounds-val">'+rounds+'</span><button class="step-btn" onclick="setRounds(&apos;'+ex.id+'&apos;,'+(rounds+1)+')">+</button><span style="font-size:12px;color:var(--dim);margin-left:4px;">/ '+(ex.rounds||'')+'</span></div></div><button class="timer-start-btn" style="width:100%;margin-top:10px;" onclick="startTimer('+(ex.rest||90)+')">⏱ Start '+(ex.rest||90)+'s rest</button><div class="rest-note">'+(ex.cue||'')+'</div></div>';
    }else{const sets=(wk.sets&&wk.sets[ex.id])||[];const ns=ex.sets||3;const topCount=sets.slice(0,ns).filter(function(s){return s&&s.reps!==''&&Number(s.reps)>=ex.hi;}).length;const done=topCount>=ns;
      let best=0;sets.forEach(function(s){if(s&&s.weight&&s.reps){const r=oneRM(s.weight,s.reps);if(r>best)best=r;}});const prVal=prs[ex.id]?prs[ex.id].value:0;const isPR=best>0&&prVal>0&&best>prVal;
      html+='<div class="ex-card'+(done?' done':'')+'"><div class="ex-header"><div class="ex-name">'+ex.name+'</div>'+(isPR?'<div class="ex-badge badge-pr">🏆 PR</div>':done?'<div class="ex-badge badge-gold">+ ADD WT</div>':'')+'</div>'+(ex.muscle?'<span class="ex-muscle">'+ex.muscle+'</span> ':'')+'<button class="demo-btn" onclick="openDemo(&apos;'+(ex.pat||'squat')+'&apos;)">▶ How to</button><div class="ex-sets-label">'+ns+' sets × '+(ex.lo===ex.hi?ex.hi:(ex.lo||8)+'–'+(ex.hi||12))+' reps</div>'+
      Array.from({length:ns},function(_,i){const s=sets[i]||{};const atTop=s.reps!==undefined&&s.reps!==''&&Number(s.reps)>=ex.hi;const rm=s.weight&&s.reps?oneRM(s.weight,s.reps):0;return '<div class="set-row"><span class="set-label">Set '+(i+1)+'</span><input class="set-input" type="number" inputmode="decimal" placeholder="wt" value="'+(s.weight!==undefined?s.weight:'')+'" onchange="setVal(&apos;'+ex.id+'&apos;,'+i+',&apos;weight&apos;,this.value)"/><span class="set-x">×</span><input class="set-input'+(atTop?' at-top':'')+'" type="number" inputmode="numeric" placeholder="reps" value="'+(s.reps!==undefined?s.reps:'')+'" onchange="setVal(&apos;'+ex.id+'&apos;,'+i+',&apos;reps&apos;,this.value)"/><span class="set-1rm">'+(rm>0?'<b>'+rm+'</b><br>1RM':'')+'</span></div>';}).join('')+
      '<div class="ex-meta"><div class="ex-meta-item">Best 1RM <span class="ex-meta-val" style="color:var(--orange)">'+(best||'—')+'</span></div><div class="ex-meta-item">PR <span class="ex-meta-val">'+(prVal||'—')+'</span></div></div><div class="act-row"><button class="timer-start-btn" onclick="startTimer(90)">⏱ 90s rest</button><button class="plate-btn" onclick="openPlateCalc()">🏋️ Plate calc</button></div>'+(ex.cue?'<div class="ex-cue">➕ '+ex.cue+'</div>':'')+'</div>';
    }
  });
  html+='<button class="btn-primary finish-btn" onclick="finishWorkout()">✓ Finish &amp; summarize</button>';
  html+='<div style="padding:0 16px;"><button class="btn-ghost" onclick="coachReset()">↻ New workout (regenerate)</button></div>';
  html+='<div style="height:80px;"></div></div>';
  return html;
}
function coachSet(k,v){state.coach[k]=v;render();}
function coachReset(){const wk=DB.getWorkout(state.date);delete wk.exercises;delete wk.title;delete wk.focus;delete wk.coachNote;delete wk.duration;DB.setWorkout(state.date,wk);state.coach={step:0,time:null,energy:null,focus:''};render();}
async function coachGenerate(){
  const fx=document.getElementById('coach-focus');if(fx)state.coach.focus=fx.value||'';
  state.aiBusy=true;render();
  try{
    const co=state.coach;
    const msg='Time available: '+co.time+' min. Energy: '+co.energy+'. Focus/notes: '+(co.focus||'none')+'. Recent training: '+recentTraining()+'. Build today&apos;s session now.';
    const raw=await callClaude(MODEL_WORKOUT,WORKOUT_SYS,[{role:'user',content:msg}],1800);
    const w=extractJSON(raw);
    const wk=DB.getWorkout(state.date);
    wk.title=w.title;wk.focus=w.focus;wk.coachNote=w.coachNote;wk.duration=w.duration;
    wk.exercises=(w.exercises||[]).map(function(e,i){e.id='g'+i;return e;});
    wk.sets=wk.sets||{};wk.rounds=wk.rounds||{};
    DB.setWorkout(state.date,wk);DB.addWorkoutDate(state.date);
    state.aiBusy=false;render();flash('💪 Workout ready!');
  }catch(e){state.aiBusy=false;render();flash('⚠️ '+(e.message||'Generation failed'));}
}

/* ════════ EAT (food chat) ════════ */
function renderEat(){
  if(!HAS_AI)return '<div class="chat-wrap"><div class="chat-messages">'+setupNeeded()+'</div></div>';
  let msgs='';
  if(state.chat.length===0){msgs='<div class="msg-row-ai"><div class="ai-avatar">🤖</div><div class="msg-bubble msg-ai">Tell me what you ate — the spot, the dish, how much — and I&apos;ll work out the calories and protein and log it against your 160g / 1,800 cal goal.<br><br>Try: <i>"Naya bowl, double chicken shawarma, hummus, tzatziki"</i> or <i>"4 chicken tacos and a beer"</i></div></div>';}
  else{msgs=state.chat.map(function(m,i){
    if(m.role==='user')return '<div class="msg-row-user"><div class="msg-bubble msg-user">'+escapeHtml(m.content)+'</div></div>';
    let h='<div class="msg-row-ai"><div class="ai-avatar">🤖</div><div class="msg-bubble msg-ai">'+escapeHtml(m.content).replace(/\n/g,'<br>');
    if(m.macros){h+='<div class="msg-macros"><div class="macro-grid"><div class="macro-item"><div class="macro-num" style="color:var(--blue)">'+m.macros.calories+'</div><div class="macro-name">cal</div></div><div class="macro-item"><div class="macro-num" style="color:var(--orange)">'+m.macros.protein+'g</div><div class="macro-name">protein</div></div><div class="macro-item"><div class="macro-num" style="color:var(--dim)">'+(m.macros.carbs||0)+'g</div><div class="macro-name">carbs</div></div><div class="macro-item"><div class="macro-num" style="color:var(--dim)">'+(m.macros.fat||0)+'g</div><div class="macro-name">fat</div></div></div><button class="log-meal-btn'+(m.logged?' done':'')+'" onclick="logMeal('+i+')">'+(m.logged?'✓ Logged':'＋ Log this meal')+'</button></div>';}
    h+='</div></div>';return h;
  }).join('');
  if(state.chatBusy)msgs+='<div class="msg-row-ai"><div class="ai-avatar">🤖</div><div class="msg-bubble msg-ai"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div>';}
  return '<div class="chat-wrap"><div class="chat-messages" id="chat-messages">'+msgs+'</div><div class="chat-input-bar"><textarea class="chat-textarea" id="chat-input" placeholder="What did you eat?" rows="1" onkeydown="if(event.key===&apos;Enter&apos;&&!event.shiftKey){event.preventDefault();sendChat();}" oninput="grow(this)"></textarea><button class="chat-send-btn" id="send-btn" onclick="sendChat()"'+(state.chatBusy?' disabled':'')+'>➤</button></div></div>';
}
function scrollChat(){const el=document.getElementById('chat-messages');if(el)el.scrollTop=el.scrollHeight;}
function grow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
async function sendChat(){
  const inp=document.getElementById('chat-input');if(!inp)return;const text=inp.value.trim();if(!text||state.chatBusy)return;
  inp.value='';inp.style.height='auto';
  state.chat.push({role:'user',content:text});state.chatBusy=true;render();scrollChat();
  try{
    const hist=state.chat.slice(-6).map(function(m){return {role:m.role==='user'?'user':'assistant',content:m.content};});
    const raw=await callClaude(MODEL_FOOD,FOOD_SYS,hist,500);
    const macroMatch=raw.match(/<macros>([\s\S]*?)<\/macros>/);
    let macros=null;if(macroMatch){try{macros=JSON.parse(macroMatch[1]);}catch(e){}}
    const clean=raw.replace(/<macros>[\s\S]*?<\/macros>/,'').trim();
    state.chat.push({role:'assistant',content:clean,macros:macros,logged:false});
  }catch(e){state.chat.push({role:'assistant',content:'⚠️ '+(e.message||'error')+' — check your API key.',macros:null});}
  state.chatBusy=false;render();scrollChat();
}
function logMeal(i){const m=state.chat[i];if(!m||!m.macros||m.logged)return;const d=DB.getDay(state.date);d.protein+=(m.macros.protein||0);d.calories+=(m.macros.calories||0);d.log.push({name:m.macros.name||'AI meal',g:m.macros.protein||0,k:m.macros.calories||0});DB.setDay(state.date,d);state.chat[i].logged=true;flash('✓ Logged '+(m.macros.protein||0)+'g protein, '+(m.macros.calories||0)+' cal');render();scrollChat();}

s;psleep&apos;,-0.5)">&#8722;</button><input class="step-input" id="psleep" type="number" step="0.5" placeholder="–" style="width:82px"/><button class="step-btn" onclick="stepProg(&apos;psleep&apos;,0.5)">+</button><span class="step-unit">hr</span></div></div><button class="btn-primary" style="margin-top:14px;" onclick="saveProgress()">✓ Save entry</button></div>'+
  (entries.length>0?'<div class="card"><div class="card-label">History</div>'+entries.slice().reverse().map(function(e){return '<div class="history-item"><div class="history-date">'+prettyDate(e.date)+'</div><div class="history-vals"><div class="history-w">'+e.weight+'<span style="font-size:11px;color:var(--dim)"> lb</span></div>'+(e.waist!=null?'<span style="font-size:12px;color:var(--dim)">'+e.waist+'″</span>':'')+(e.sleep!=null?'<span style="font-size:12px;color:var(--dim)">'+e.sleep+'h</span>':'')+'</div><button class="btn-icon" onclick="deleteProgress(&apos;'+e.date+'&apos;)">🗑</button></div>';}).join('')+'</div>':'')+'<div style="height:20px;"></div></div>';
}
function buildChart(entries){const W=310,H=140,PL=30,PR=14,PT=8,PB=22;const vals=entries.map(function(e){return e.weight;});const mn=Math.min.apply(null,vals.concat([GOAL.targetW]))-1.5,mx=Math.max.apply(null,vals.concat([GOAL.targetW]))+1.5;const n=entries.length;const tx=function(i){return PL+(i/(n-1))*(W-PL-PR);};const ty=function(v){return PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);};const gy=ty(GOAL.targetW);const pts=entries.map(function(e,i){return tx(i).toFixed(1)+','+ty(e.weight).toFixed(1);}).join(' ');const area=tx(0).toFixed(1)+','+(H-PB)+' '+pts+' '+tx(n-1).toFixed(1)+','+(H-PB);return '<svg width="100%" viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF7A3D" stop-opacity=".3"/><stop offset="100%" stop-color="#FF7A3D" stop-opacity="0"/></linearGradient></defs><line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'" stroke="#FF6A2C" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-PR+2)+'" y="'+(gy+4).toFixed(1)+'" fill="#FF6A2C" font-size="10" font-family="Archivo" font-weight="700">147</text><polygon points="'+area+'" fill="url(#ag)"/><polyline points="'+pts+'" fill="none" stroke="#FF6A2C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+entries.map(function(e,i){return '<circle cx="'+tx(i).toFixed(1)+'" cy="'+ty(e.weight).toFixed(1)+'" r="4" fill="#FF6A2C"/>';}).join('')+'<text x="'+tx(0).toFixed(1)+'" y="'+(H-4)+'" fill="#8B8794" font-size="10" font-family="Plus Jakarta Sans" text-anchor="middle">'+entries[0].date.slice(5)+'</text>'+(n>2?'<text x="'+tx(n-1).toFixed(1)+'" y="'+(H-4)+'" fill="#8B8794" font-size="10" font-family="Plus Jakarta Sans" text-anchor="middle">'+entries[n-1].date.slice(5)+'</text>':'')+'</svg>';}

function openGym(){const m=document.getElementById('modal-body');m.innerHTML='<div class="sheet-title" style="margin-bottom:2px;">MY GYM</div><div style="font-size:12px;color:var(--dim);font-weight:600;margin-bottom:6px;">The AI builds workouts from exactly this list.</div>'+Object.keys(EQUIPMENT).map(function(cat){return '<div class="equip-cat">'+cat+'</div><div class="equip-tags">'+EQUIPMENT[cat].map(function(it){return '<span class="equip-tag">'+it+'</span>';}).join('')+'</div>';}).join('')+'<button class="btn-primary" style="margin-top:18px;" onclick="closeModal()">Looks right</button>';document.getElementById('modal').classList.add('open');}
function openPlateCalc(){const m=document.getElementById('modal-body');m.innerHTML='<div class="sheet-title" style="margin-bottom:16px;">PLATE CALCULATOR</div><div class="plate-input-row"><span style="font-size:14px;font-weight:500;">Target weight</span><div class="stepper"><button class="step-btn" onclick="plateAdj(-5)">&#8722;</button><input class="step-input" id="plate-target" type="number" value="135" style="width:90px" oninput="plateCalc()"/><button class="step-btn" onclick="plateAdj(5)">+</button><span class="step-unit">lb</span></div></div><div class="plate-per-side">Plates per side (45 lb bar):</div><div class="plate-result" id="plate-result"></div><button class="btn-ghost" onclick="closeModal()">Close</button>';document.getElementById('modal').classList.add('open');plateCalc();}
function plateAdj(d){const el=document.getElementById('plate-target');el.value=Math.max(45,(parseFloat(el.value)||45)+d);plateCalc();}
function plateCalc(){const target=parseFloat(document.getElementById('plate-target').value)||45;const res=document.getElementById('plate-result');let perSide=(target-BAR)/2;if(perSide<0){res.innerHTML='<span class="plate-empty">Below bar weight</span>';return;}if(perSide===0){res.innerHTML='<span class="plate-empty">Just the bar — 45 lb</span>';return;}let html='';let rem=perSide;PLATES.forEach(function(p){while(rem>=p-0.01){const h=Math.min(64,30+p*0.55);html+='<div class="plate" style="width:'+Math.max(32,h*0.66)+'px;height:'+h+'px;background:'+(PLATE_COLORS[p]||'#888')+';">'+p+'</div>';rem=Math.round((rem-p)*100)/100;}});if(rem>0.01)html+='<span class="plate-empty">+'+rem+' lb</span>';res.innerHTML=html||'<span class="plate-empty">—</span>';}

function finishWorkout(){const wk=DB.getWorkout(state.date);const v=workoutVolume(wk);let prCount=0;const prs=DB.getPRs();(wk.exercises||[]).forEach(function(ex){if(ex.type)return;const sets=(wk.sets&&wk.sets[ex.id])||[];let best=0;sets.forEach(function(s){if(s&&s.weight&&s.reps){const r=oneRM(s.weight,s.reps);if(r>best)best=r;}});if(best>0&&(!prs[ex.id]||best>prs[ex.id].value))prCount++;});let cr=0;(wk.exercises||[]).forEach(function(ex){if(ex.type&&wk.rounds&&wk.rounds[ex.id])cr+=wk.rounds[ex.id];});const m=document.getElementById('modal-body');m.innerHTML='<div class="summary-hero"><div style="font-size:42px;">💪</div><div class="summary-title">WORKOUT DONE</div><div style="font-size:13px;color:var(--dim);margin-top:4px;font-weight:600;">'+(wk.title||'')+'</div></div><div class="summary-grid"><div class="summary-stat"><div class="summary-num" style="color:var(--orange)">'+(v.vol/1000).toFixed(1)+'k</div><div class="summary-lbl">lb volume</div></div><div class="summary-stat"><div class="summary-num" style="color:var(--green)">'+v.sets+'</div><div class="summary-lbl">sets</div></div><div class="summary-stat"><div class="summary-num" style="color:var(--red)">'+prCount+'</div><div class="summary-lbl">new PRs</div></div><div class="summary-stat"><div class="summary-num" style="color:var(--blue)">'+cr+'</div><div class="summary-lbl">finisher rounds</div></div></div><button class="btn-primary" onclick="closeModal()">'+(prCount>0?'🏆 Crushed it':'Done')+'</button>';document.getElementById('modal').classList.add('open');if(prCount>0)confetti();}

function switchTab(t){state.tab=t;document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===t);});render();}
function shiftDay(n){state.date=shiftDate(state.date,n);render();}
function goToday(){state.date=localDate();render();}
function nudge(f,d){const day=DB.getDay(state.date);day[f]=Math.max(0,(day[f]||0)+d);DB.setDay(state.date,day);render();}
function manualSet(f,v){const day=DB.getDay(state.date);day[f]=Math.max(0,Number(v)||0);DB.setDay(state.date,day);}
function saveNotes(v){const day=DB.getDay(state.date);day.notes=v;DB.setDay(state.date,day);}
function removeLog(i){const day=DB.getDay(state.date);const it=day.log[i];day.protein=Math.max(0,day.protein-it.g);day.calories=Math.max(0,day.calories-it.k);day.log.splice(i,1);DB.setDay(state.date,day);render();}
function openSheet(){const list=document.getElementById('sheet-list');const groups=[{tag:'lunch',title:'Lunch anchors'},{tag:'dinner',title:'Dinner'},{tag:'snack',title:'Snacks'},{tag:'morning',title:'Morning'}];list.innerHTML=groups.map(function(g){return '<div class="food-group-title">'+g.title+'</div>'+FOODS.filter(function(f){return f.tag===g.tag;}).map(function(f){const idx=FOODS.indexOf(f);return '<button class="food-row-btn" onclick="addFoodByIdx('+idx+')"><span class="food-name">'+f.name+'</span><span class="food-g">'+f.g+'g</span></button>';}).join('');}).join('');document.getElementById('sheet').classList.add('open');}
function closeSheet(){document.getElementById('sheet').classList.remove('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function addFoodByIdx(i){const f=FOODS[i];if(!f)return;const day=DB.getDay(state.date);day.protein=(day.protein||0)+f.g;day.calories=(day.calories||0)+f.k;day.log.push({name:f.name,g:f.g,k:f.k});DB.setDay(state.date,day);closeSheet();render();}
function setVal(exId,i,field,v){const wk=DB.getWorkout(state.date);if(!wk.sets)wk.sets={};if(!wk.sets[exId])wk.sets[exId]=[];while(wk.sets[exId].length<=i)wk.sets[exId].push({});wk.sets[exId][i]=Object.assign({},wk.sets[exId][i],field==='weight'?{weight:v===''?'':Number(v)}:{reps:v===''?'':Number(v)});DB.setWorkout(state.date,wk);DB.addWorkoutDate(state.date);const s=wk.sets[exId][i];if(s.weight&&s.reps){const rm=oneRM(s.weight,s.reps);const prs=DB.getPRs();const prev=prs[exId]?prs[exId].value:0;if(rm>prev&&prev>0){prs[exId]={value:rm,date:state.date};DB.setPRs(prs);flash('🏆 New PR! Est. 1RM '+rm+' lb');confetti();}else if(prev===0){prs[exId]={value:rm,date:state.date};DB.setPRs(prs);}}if(field==='reps'&&v!=='')startTimer(90);render();}
function setRounds(exId,n){const wk=DB.getWorkout(state.date);if(!wk.rounds)wk.rounds={};wk.rounds[exId]=Math.max(0,n);DB.setWorkout(state.date,wk);DB.addWorkoutDate(state.date);render();}
function stepProg(id,d){const el=document.getElementById(id);if(!el)return;el.value=Math.max(0,parseFloat(el.value||0)+d).toFixed(id==='pwaist'?2:1);}
function saveProgress(){const date=document.getElementById('prog-date').value||localDate();const w=document.getElementById('pw').value;if(!w)return;const entries=DB.getProgress().filter(function(e){return e.date!==date;});entries.push({date:date,weight:parseFloat(w),waist:document.getElementById('pwaist').value?parseFloat(document.getElementById('pwaist').value):null,sleep:document.getElementById('psleep').value?parseFloat(document.getElementById('psleep').value):null});DB.setProgress(entries);render();flash('✓ Logged '+w+' lb');}
function deleteProgress(date){DB.setProgress(DB.getProgress().filter(function(e){return e.date!==date;}));render();}

render();
</script>
